version: 2
updates:
  # Keep our GitHub Actions (SHA-pinned) up to date automatically.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7        # batch/settle updates before opening PRs
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions"]
