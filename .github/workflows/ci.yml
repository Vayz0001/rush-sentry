name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck bin/toolkit bin/lib/common.sh scanners/*/run.sh setup.sh
      - name: python syntax
        run: python3 -m py_compile notify/watch.py
      - name: unit tests
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pytest
          /tmp/venv/bin/pytest tests/ -q
      - name: validate compose
        run: docker compose -f lab/docker-compose.yml config -q
      - name: toolkit smoke
        run: |
          chmod +x bin/toolkit
          ./bin/toolkit version
          ./bin/toolkit help >/dev/null
          ./bin/toolkit manifest | python3 -c 'import json,sys; json.load(sys.stdin)'
