name: dogfood
# Run rush-sentry's own scanners against rush-sentry and publish findings to the
# Security tab. The best proof a security tool works is that it scans itself.
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule: [{ cron: "23 6 * * 1" }]   # weekly, odd minute
permissions:
  contents: read            # least privilege at top level
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # only this job needs to write findings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }   # full history for secret scanning
      - name: run toolkit scan all
        run: |
          chmod +x bin/toolkit
          ./setup.sh || true
          ./bin/toolkit scan all --target . --format sarif > combined.sarif || true
          test -s combined.sarif
      - name: summarize findings
        if: always()
        run: |
          echo "### rush-sentry dogfood scan" >> "$GITHUB_STEP_SUMMARY"
          if [ -s combined.sarif ]; then
            jq -r '.runs[] | "- **\(.tool.driver.name)**: \([.results[]] | length) finding(s)"' combined.sarif >> "$GITHUB_STEP_SUMMARY" || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_Total: $(jq '[.runs[].results[]] | length' combined.sarif) finding(s)._" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No SARIF produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: upload SARIF to code scanning
        # Code scanning writes to the Security tab, which is free on PUBLIC repos
        # but needs GitHub Advanced Security on private ones. Skip cleanly while
        # private; this activates automatically when the repo is flipped public.
        # continue-on-error guards scheduled runs where repo visibility is unknown.
        if: ${{ !github.event.repository.private }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: combined.sarif
          category: rush-sentry
