name: scorecard
# OpenSSF Scorecard — repo security-posture score + badge.
# Fully effective once the repo is PUBLIC (publish_results needs a public repo);
# the guard below skips it while private so it doesn't show as failed.
on:
  branch_protection_rule:
  schedule: [{ cron: "19 7 * * 2" }]
  push: { branches: [main] }
permissions: read-all
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.visibility == 'public' }}
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: scorecard
