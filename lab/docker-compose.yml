# rush-sentry lab — isolated, intentionally-vulnerable web targets.
# ⛔ DO NOT EXPOSE.
#
# Design: the vulnerable targets sit on `labnet` (internal:true) with NO outbound
# route — a reverse shell/payload in a target cannot phone home or pivot. A thin
# nginx `gateway` straddles labnet + a normal `edge` network and is the ONLY way
# the host reaches the targets (loopback-published). The gateway runs no
# vulnerable code. Verify after every up:  ./bin/toolkit lab verify  (-> BLOCKED)
#
# The ATTACKER TOOLBOX (profile "attacker", off by default) attaches ONLY to
# labnet — the tools can reach the targets by service name but have NO route to
# the internet or host, so the airgap itself scopes them to the lab. Authorized
# / defensive use only. Run via:  ./bin/toolkit lab attack <tool> [args...]

networks:
  labnet:                   # airgapped: targets live here, no internet
    name: rush_sentry_labnet
    driver: bridge
    internal: true
  edge:                     # normal bridge, ONLY the gateway attaches (for publish)
    name: rush_sentry_edge
    driver: bridge

services:
  gateway:                  # thin TCP forwarder host<->targets (no app logic)
    image: nginx:alpine
    networks: [labnet, edge]
    ports:
      - "127.0.0.1:3000:3000"   # -> juice-shop
      - "127.0.0.1:8080:8080"   # -> dvwa
      - "127.0.0.1:5000:5000"   # -> vampi
    volumes:
      - ./gateway.nginx.conf:/etc/nginx/nginx.conf:ro
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 64m
    restart: unless-stopped
    depends_on: [juice-shop, dvwa, vampi]

  juice-shop:               # OWASP Juice Shop — modern OWASP Top 10
    image: bkimminich/juice-shop:latest
    networks: [labnet]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped

  dvwa:                     # Damn Vulnerable Web App (official, all-in-one w/ db)
    image: ghcr.io/digininja/dvwa:latest
    networks: [labnet]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 300
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped

  vampi:                    # VAmPI — vulnerable REST API (BOLA/auth practice)
    image: erev0s/vampi:latest
    networks: [labnet]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  # ======================= ATTACKER TOOLBOX (profile: attacker) ==============
  # Off by default. labnet-only (airgapped). Run-on-demand, not long-running.
  # Reach targets by service name: http://juice-shop:3000, http://dvwa,
  # http://vampi:5000. Official upstream images except ffuf/sqlmap (community,
  # pinned by tag — see lab/README.md). Invoke: ./bin/toolkit lab attack <tool> …

  nuclei:                   # template-based DAST / CVE + misconfig scanner (MIT)
    image: projectdiscovery/nuclei:latest
    profiles: ["attacker"]
    networks: [labnet]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 300
    mem_limit: 768m
    entrypoint: ["nuclei"]

  httpx:                    # fast live-host / tech-detection probe (MIT)
    image: projectdiscovery/httpx:latest
    profiles: ["attacker"]
    networks: [labnet]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 256m
    entrypoint: ["httpx"]

  katana:                   # JS-aware crawler for SPAs like Juice Shop (MIT)
    image: projectdiscovery/katana:latest
    profiles: ["attacker"]
    networks: [labnet]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 512m
    entrypoint: ["katana"]

  ffuf:                     # web fuzzer / content discovery (MIT; community image)
    image: secsi/ffuf:latest
    profiles: ["attacker"]
    networks: [labnet]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 256m
    entrypoint: ["ffuf"]

  sqlmap:                   # automated SQLi detection/exploitation (GPL; community)
    image: secsi/sqlmap:latest
    profiles: ["attacker"]
    networks: [labnet]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 512m
    entrypoint: ["sqlmap"]

  schemathesis:             # property-based API testing from OpenAPI (MIT)
    image: schemathesis/schemathesis:stable
    profiles: ["attacker"]
    networks: [labnet]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 512m
    entrypoint: ["schemathesis"]

  zap:                      # OWASP ZAP full DAST (Apache-2.0)
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: ["attacker"]
    networks: [labnet]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 500
    mem_limit: 2g
    entrypoint: ["zap.sh"]
