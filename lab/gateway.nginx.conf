# rush-sentry lab gateway - thin TCP forwarder so the host (loopback) can reach
# targets that live on the airgapped internal network. The gateway is the ONLY
# component that straddles both networks; it runs no vulnerable code. The
# vulnerable targets themselves have no outbound route.
worker_processes 1;
events { worker_connections 256; }

stream {
  resolver 127.0.0.11 valid=10s;   # Docker embedded DNS

  server { listen 3000; proxy_pass juice-shop:3000; }
  server { listen 8080; proxy_pass dvwa:80; }
  server { listen 5000; proxy_pass vampi:5000; }
}
